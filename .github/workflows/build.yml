name: Build and release
on:
  push:
    branches: [main]
    paths: ['Stride-Android-App.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Set version
        run: echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Build
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          unzip -q Stride-Android-App.zip
          cd Stride
          echo "$KEYSTORE_B64" | base64 -d > app/stride.jks
          gradle assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION_CODE" "Stride/app/build/outputs/apk/debug/app-debug.apk#stride.apk" --title "Stride $VERSION_CODE" --notes "$(cat Stride/RELEASE_NOTES.txt)"
